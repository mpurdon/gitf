name: standard
description: |
  The Factory's default mission workflow. Mirrors the legacy hardcoded
  phase order shipped before v0.59 — preserved exactly, but now declared
  in this file rather than dispatched by `Major.Orchestrator.advance_via_legacy/2`.

  Conditional `next:`/`on_pass:` rules encode the data-driven routing
  legacy did with `route_to_first_unskipped_phase/1`,
  `Override.requires_approval?/1`, the `bug_reproducible == false`
  short-circuit, and the single-variant-design "skip review" optimisation.

phases:
  - id: triage
    handler: GiTF.Phases.Triage
    timeout_minutes: 5
    # Routing matches Orchestrator.Decisions.next_phase_after_triage/1 +
    # the `bug_reproducible == false` + strong-evidence short-circuit
    # (Phases.Triage.before_advance stamps `no_work_needed` when the
    # evidence is strong enough; the `then: end` rule completes the
    # mission via Phases.Triage.terminal/3).
    next:
      - when: "artifact.no_work_needed == true"
        then: end
      - when: "artifact.skip_flags.skip_research != true"
        then: research
      - when: "artifact.skip_flags.skip_requirements != true"
        then: requirements
      - when: "artifact.skip_flags.skip_design != true"
        then: design
      - when: "artifact.skip_flags.skip_review != true"
        then: review
      - when: "artifact.skip_flags.skip_planning != true"
        then: planning
      - else: implementation

  - id: research
    handler: GiTF.Phases.Research
    timeout_minutes: 30
    model_tier: general
    inject_knowledge: true
    inject_skills: false
    produces: research
    next: requirements

  - id: requirements
    handler: GiTF.Phases.Requirements
    timeout_minutes: 30
    model_tier: general
    inject_knowledge: true
    reads: [research]
    produces: requirements
    next: design

  - id: design
    handler: GiTF.Phases.Design
    timeout_minutes: 45
    model_tier: opus
    inject_knowledge: true
    strategies: [minimal, normal, complex]
    reads: [requirements, research]
    produces: design
    # Phases.Design.before_advance writes `single_variant`. A single-variant
    # design has nothing for review to pick among, so skip straight to
    # planning — matches the legacy check_design_complete optimisation.
    next:
      - when: "artifact.single_variant == true"
        then: planning
      - else: review

  - id: review
    handler: GiTF.Phases.Review
    timeout_minutes: 30
    model_tier: opus
    inject_knowledge: true
    reads: [design, requirements]
    produces: review
    on_pass: planning
    on_fail: design
    max_retries: 2
    on_exhausted: advance

  - id: planning
    handler: GiTF.Phases.Planning
    timeout_minutes: 30
    model_tier: general
    inject_knowledge: true
    gate:
      when: "mission.review_plan == true"
      action: await_operator
    reads: [design, requirements, review]
    produces: planning
    next: implementation

  - id: implementation
    handler: GiTF.Phases.Implementation
    timeout_minutes: 90
    model_tier: opus
    inject_knowledge: true
    inject_skills: true
    reads: [planning, design]
    produces: implementation
    next: validation

  - id: validation
    handler: GiTF.Phases.Validation
    timeout_minutes: 60
    model_tier: general
    inject_knowledge: true
    reads: [implementation, requirements]
    produces: validation
    # Phases.Validation.verdict/2 stamps `artifact.requires_approval` from
    # Override.requires_approval?/1 before returning :pass — the conditional
    # on_pass routes between human-approval and direct merge. on_fail is
    # declared for the schema's sake but is unreachable: verdict/2 only
    # returns :pass / :wait / :terminal_fail (the latter handled via
    # max_retries: 0 + on_exhausted: fail → Phases.Validation.terminal/3).
    on_pass:
      - when: "artifact.requires_approval == true"
        then: awaiting_approval
      - else: sync
    on_fail: validation
    max_retries: 0
    on_exhausted: fail

  - id: awaiting_approval
    handler: GiTF.Phases.AwaitingApproval
    # Phases.AwaitingApproval.verdict/2 covers `:approved`/`:not_required`
    # → :pass; `:rejected` → :terminal_fail; `:pending` (timeout + auto-
    # approve / auto-reject / critical-risk alert).
    on_pass: sync
    on_fail: awaiting_approval
    max_retries: 0
    on_exhausted: fail

  - id: sync
    handler: GiTF.Phases.Sync
    timeout_minutes: 30
    next: simplify

  - id: simplify
    handler: GiTF.Phases.Simplify
    timeout_minutes: 30
    model_tier: general
    reads: [implementation]
    produces: simplify
    next: publish

  - id: publish
    handler: GiTF.Phases.Publish
    timeout_minutes: 15
    reads: [simplify, implementation]
    produces: publish
    next: scoring

  - id: scoring
    handler: GiTF.Phases.Scoring
    timeout_minutes: 15
    model_tier: general
    reads: [validation, requirements]
    produces: scoring
    next: end
