# arm64-only CI: dev Macs, these runners, and the Graviton deploy target all
# share the architecture. The job runs inside the same Debian bookworm builder
# image as the Dockerfile, for two reasons:
#   - ex_termbox's waf build needs Python < 3.12 (bookworm has 3.11; the
#     ubuntu-24.04 runner image has 3.12)
#   - a release built against bookworm's older glibc runs on both Debian 12
#     and the Ubuntu 24.04 AMI (the reverse would not)
# Test and release build share one job (and one container, cache, and dep
# fetch); the release steps only run on pushes to main.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual fallback: GitHub drops push events during Actions outages and
  # never replays them (bit us 2026-08-26). Dispatch builds main like a push.
  workflow_dispatch:

# contents: write lets the job publish GitHub Releases (escript + tarball),
# which feed `gitf self-update` and the Homebrew tap.
permissions:
  contents: write

jobs:
  ci:
    # NOTE: this runner label is the single point for the whole release/
    # distribution path. If GitHub retires it, jobs QUEUE FOREVER rather
    # than erroring. Fallback: a self-hosted arm64 runner, or cross-build
    # via QEMU on ubuntu-latest (slow but functional).
    runs-on: ubuntu-24.04-arm
    # NOTE: hexpm only publishes snapshot-dated tags and rotates old ones out
    # of Docker Hub — when this pull starts 404ing, bump the date (and keep
    # the Dockerfile's builder stage on the same tag).
    container:
      image: hexpm/elixir:1.18.4-erlang-27.2.4-debian-bookworm-20260803-slim
    steps:
      - name: Install build dependencies
        run: |
          apt-get update
          apt-get install -y build-essential git python3 python-is-python3 procps
          mix local.hex --force
          mix local.rebar --force

      - uses: actions/checkout@v4

      - name: Trust the checkout directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Cache deps and build
        uses: actions/cache@v4
        with:
          path: |
            deps
            _build
          key: mix-${{ hashFiles('mix.lock') }}
          restore-keys: mix-

      - name: Compile (warnings are errors)
        run: |
          mix deps.get
          # ex_termbox bundles waf 2.0.14, whose Python uses the 'rU' open
          # mode removed in Python 3.11. waf self-extracts its waflib on
          # first run, so trigger the unpack (harmless failure), then patch
          # the extracted files. Idempotent, so cached deps are fine.
          (cd deps/ex_termbox/c_src/termbox && python3 ./waf --version >/dev/null 2>&1 || true)
          sed -i "s/'rU'/'r'/g" deps/ex_termbox/c_src/termbox/.waf3-*/waflib/*.py
          mix compile --warnings-as-errors

      - name: Run the unit suite
        run: mix test

      - name: Build release tarball
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          MIX_ENV: prod
          RELEASE_TAR: "1"
        run: |
          # The cache restores tarballs from earlier versions (the version
          # bumps every commit) — clear them so the artifact glob below only
          # matches the fresh build.
          rm -f _build/prod/gitf-*.tar.gz
          mix release --overwrite

      - name: Upload release tarball
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: gitf-release-arm64
          path: _build/prod/gitf-*.tar.gz
          if-no-files-found: error
          retention-days: 30

      # The installer (systemd units + the idle-stop/backup scripts) is what
      # a deploy runs, but it ships separately from the release tarball. It
      # used to be built by hand, so a change to rel/ silently did not reach
      # any box until someone remembered — an override feature sat undeployed
      # exactly that way. Build it every time so it cannot drift.
      - name: Package installer
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: tar czf gitf-installer.tar.gz rel bin

      - name: Upload installer
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: gitf-installer
          path: gitf-installer.tar.gz
          if-no-files-found: error
          retention-days: 30

      # The escript is BEAM bytecode (arch-independent, needs Erlang >= the
      # build OTP on the host). It ships via GitHub Releases so
      # `gitf self-update` and the Homebrew tap can fetch it without auth.
      - name: Build escript
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          MIX_ENV: prod
        run: mix escript.build

      - name: Read version
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: version
        env:
          MIX_ENV: prod
        run: echo "version=$(mix eval 'IO.puts(Mix.Project.config()[:version])')" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: gitf ${{ steps.version.outputs.version }}
          files: |
            gitf
            _build/prod/gitf-*.tar.gz
          make_latest: true

      - name: Bump Homebrew formula
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            # Silent skip let brew users diverge unboundedly while releases
            # kept publishing — a missing secret on a main push is a failure.
            echo "::error::TAP_GITHUB_TOKEN not set — Homebrew formula NOT bumped" >&2
            exit 1
          fi
          SHA=$(sha256sum gitf | cut -d' ' -f1)
          git clone --depth 1 "https://x-access-token:${TAP_TOKEN}@github.com/mpurdon/homebrew-tap" /tmp/tap
          sed -i \
            -e "s|download/v[0-9.]*/gitf|download/v${VERSION}/gitf|" \
            -e "s|^  sha256 \".*\"|  sha256 \"${SHA}\"|" \
            -e "s|^  version \".*\"|  version \"${VERSION}\"|" \
            /tmp/tap/Formula/gitf.rb
          # A sed that silently matched nothing would publish releases the
          # formula never points at — assert the substitutions landed.
          grep -q "download/v${VERSION}/gitf" /tmp/tap/Formula/gitf.rb
          grep -q "sha256 \"${SHA}\"" /tmp/tap/Formula/gitf.rb
          grep -q "version \"${VERSION}\"" /tmp/tap/Formula/gitf.rb
          cd /tmp/tap
          if git diff --quiet; then
            echo "Formula already at ${VERSION}; nothing to bump."
            exit 0
          fi
          git config user.name "Ghost-Factory"
          git config user.email "factory@ghostinthefactory.com"
          git commit -am "gitf ${VERSION}"
          git push
